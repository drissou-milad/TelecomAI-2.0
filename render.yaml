services:
  # TelecomAI 2.0 — Unified Full-Stack Node/TypeScript Operational Intelligence Platform
  # Built with Vite, Express, esbuild, and native in-memory ML correlation engine
  - type: web
    name: telecomai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
