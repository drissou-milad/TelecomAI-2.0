name: TelecomAI 2.0 CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Verification & Linter
        run: npm run lint

      - name: Run TelecomAI 2.0 Intelligence Loop Verification Tests
        run: npm test

      - name: Production Bundle Build (Vite + esbuild)
        run: npm run build
